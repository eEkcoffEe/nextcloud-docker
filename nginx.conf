events {
    worker_connections 1024;
}

http {
    # HTTP server for ACME challenge and redirect
    server {
        listen 80;
        listen [::]:80;
        server_name nextcloud-element-qwen.duckdns.org;

        # ACME challenge for Let's Encrypt
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS server
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name nextcloud-element-qwen.duckdns.org;

        # SSL certificates for correct domain
        ssl_certificate /etc/letsencrypt/live/nextcloud-element-qwen.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/nextcloud-element-qwen.duckdns.org/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        # HSTS
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Nextcloud
        location / {
            proxy_pass http://nextcloud:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # Increase max body size for file uploads
            client_max_body_size 10G;

            # Timeout for Talk video calls
            proxy_read_timeout 600;
            proxy_send_timeout 600;
        }

        # Nextcloud Notify Push
        location /push/ {
            proxy_pass http://notify-push:7867/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # WebSocket support for push
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Well-known URLs for Nextcloud
        location /.well-known/carddav {
            return 301 $scheme://$host/remote.php/dav;
        }

        location /.well-known/caldav {
            return 301 $scheme://$host/remote.php/dav;
        }

        location /.well-known/webfinger {
            return 301 $scheme://$host/index.php/.well-known/webfinger;
        }

        location /.well-known/nodeinfo {
            return 301 $scheme://$host/index.php/.well-known/nodeinfo;
        }

        # Deny access to sensitive files
        location ~ /\.ht {
            deny all;
        }

        location ~ /(data|config|\.htaccess) {
            deny all;
        }
    }
}
