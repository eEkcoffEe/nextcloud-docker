services:
  # Database - PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: nextcloud-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=nextcloud
      - POSTGRES_USER=nextcloud
      - POSTGRES_PASSWORD=NextcloudDBPassword2026!
    volumes:
      - ./db-data:/var/lib/postgresql/data
    networks:
      - nextcloud-net

  # Redis - for caching
  redis:
    image: redis:alpine
    container_name: nextcloud-redis
    restart: unless-stopped
    networks:
      - nextcloud-net

  # NATS - for Talk signaling
  nats:
    image: nats:alpine
    container_name: nextcloud-nats
    restart: unless-stopped
    networks:
      - nextcloud-net
    expose:
      - "4222"

  # Notify Push - for Nextcloud desktop/mobile push notifications
  notify-push:
    image: icewind1991/notify_push:latest
    container_name: nextcloud-notify-push
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgres://nextcloud:NextcloudDBPassword2026!@db/nextcloud
      - REDIS_URL=redis://redis
      - NEXTCLOUD_URL=https://nextcloud-element-qwen.duckdns.org
      - PORT=7867
    networks:
      - nextcloud-net
    expose:
      - "7867"
    depends_on:
      - nextcloud
      - db
      - redis

  # Nextcloud Talk High-Performance Backend (Signaling Server)
  talk-signaling:
    image: strukturag/nextcloud-spreed-signaling:latest
    container_name: nextcloud-talk-signaling
    restart: unless-stopped
    command: ["/usr/bin/nextcloud-spreed-signaling", "-config", "/config/server.conf"]
    volumes:
      - ./talk-signaling/server.conf:/config/server.conf:ro
    networks:
      - nextcloud-net
    expose:
      - "8080"
    depends_on:
      - nats

  # Nextcloud Talk Recording Server
  talk-recording:
    image: ghcr.io/librecodecoop/nextcloud-talk-recording:latest
    container_name: nextcloud-talk-recording
    restart: unless-stopped
    environment:
      - NC_DOMAIN=nextcloud-element-qwen.duckdns.org
      - HPB_DOMAIN=nextcloud-element-qwen.duckdns.org
      - HPB_PATH=/standalone-signaling/
      - RECORDING_SECRET=talk_recording_secret_2026_secure_key
      - INTERNAL_SECRET=internal_secret_2026
      - VIRTUAL_HOST=nextcloud-element-qwen.duckdns.org
      - LETSENCRYPT_HOST=nextcloud-element-qwen.duckdns.org
      - SKIP_VERIFY=true
    volumes:
      - ./talk-recording:/var/lib/nextcloud-recordings
    networks:
      - nextcloud-net
    depends_on:
      - talk-signaling
      - nextcloud
    shm_size: 2gb

  # Nextcloud with Talk
  nextcloud:
    image: nextcloud:stable-apache
    container_name: nextcloud-app
    restart: unless-stopped
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_DB=nextcloud
      - POSTGRES_USER=nextcloud
      - POSTGRES_PASSWORD=NextcloudDBPassword2026!
      - REDIS_HOST=redis
      - NEXTCLOUD_ADMIN_USER=admin
      - NEXTCLOUD_ADMIN_PASSWORD=NextcloudAdmin2026!
      - NEXTCLOUD_TRUSTED_DOMAINS=nextcloud-element-qwen.duckdns.org
      - OVERWRITEPROTOCOL=https
      - OVERWRITEHOST=nextcloud-element-qwen.duckdns.org
      - OVERWRITECLIURL=https://nextcloud-element-qwen.duckdns.org
      - SIGNALING_SERVER=https://nextcloud-element-qwen.duckdns.org/standalone-signaling/
    volumes:
      - ./html:/var/www/html
      - ./config:/var/www/html/config
      - ./apps:/var/www/html/custom_apps
      - ./data:/var/www/html/data
    depends_on:
      - db
      - redis
    networks:
      - nextcloud-net
    expose:
      - "80"

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: nextcloud-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - nextcloud
    networks:
      - nextcloud-net

networks:
  nextcloud-net:
    driver: bridge
